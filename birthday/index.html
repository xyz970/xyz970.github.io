<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Selamat Ulang Tahun!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <meta name="description" content="Hadiah buat Sayangku tercinta. Selamat ulang tahun!">
    
    <style>
        :root {
            --pink-light: #ffd1dc;
            --pink-main: #ffb6c1;
            --pink-dark: #ff6b81;
            --gold-light: #ffea70;
            --gold-main: #ffd700;
            --gold-dark: #daa520;
            --bg-dark-top: #2a1124;
            --bg-dark-bottom: #0f0514;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-dark-top), var(--bg-dark-bottom));
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas for Fireworks & Confetti */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Container for floating elements (hearts/balloons) */
        #floating-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-item {
            position: absolute;
            bottom: -50px;
            font-size: 2rem;
            animation: floatUp linear forwards;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        /* UI Containers */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s ease-in-out;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* Gift Box Styles */
        .gift-container {
            position: relative;
            cursor: pointer;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gift-box {
            position: relative;
            width: 150px;
            height: 120px;
            background-color: var(--pink-main);
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.1);
            animation: bounce 2s infinite ease-in-out;
            transform-origin: bottom center;
        }

        /* Vertical Ribbon */
        .gift-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 100%;
            background: linear-gradient(to right, var(--gold-dark), var(--gold-main), var(--gold-dark));
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        /* Horizontal Ribbon */
        .gift-box::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 24px;
            background: linear-gradient(to bottom, var(--gold-dark), var(--gold-main), var(--gold-dark));
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        .gift-lid {
            position: absolute;
            top: -30px;
            left: -10px;
            width: 170px;
            height: 40px;
            background-color: var(--pink-dark);
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 2;
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
            transform-origin: center;
        }

        /* Lid Ribbon */
        .gift-lid::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 100%;
            background: linear-gradient(to right, var(--gold-dark), var(--gold-main), var(--gold-dark));
        }

        /* The Bow */
        .bow {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 30px;
            z-index: 3;
            display: flex;
            justify-content: center;
        }
        
        .bow::before, .bow::after {
            content: '';
            position: absolute;
            width: 35px;
            height: 25px;
            border: 5px solid var(--gold-main);
            border-radius: 50% 50% 0 50%;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        .bow::before {
            left: -5px;
            transform: rotate(15deg);
        }

        .bow::after {
            right: -5px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-15deg);
        }

        /* Light burst from inside box */
        .light-burst {
            position: absolute;
            top: -50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,215,0,0.8) 30%, rgba(255,182,193,0) 70%);
            border-radius: 50%;
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* Hint Text */
        .hint-text {
            margin-top: 50px;
            font-size: 1.1rem;
            color: var(--pink-light);
            animation: pulse 1.5s infinite;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-weight: 300;
            transition: color 0.3s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Success Shake */
        .shake {
            animation: shakeAnim 1s ease-in-out forwards !important;
        }

        /* Denied/Error Shake */
        .denied-shake {
            animation: deniedAnim 0.4s ease-in-out !important;
        }

        @keyframes shakeAnim {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-5px, -5px) rotate(-3deg); }
            20% { transform: translate(5px, 5px) rotate(3deg); }
            30% { transform: translate(-5px, 5px) rotate(-3deg); }
            40% { transform: translate(5px, -5px) rotate(3deg); }
            50% { transform: translate(-5px, -5px) rotate(-3deg); }
            60% { transform: translate(5px, 5px) rotate(3deg); }
            70% { transform: translate(-5px, 5px) rotate(-3deg); }
            80% { transform: translate(5px, -5px) rotate(3deg); }
            90% { transform: translate(-3px, -3px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes deniedAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .pop-lid {
            transform: translateY(-150px) rotate(25deg) scale(1.2) !important;
            opacity: 0 !important;
        }

        .burst-anim {
            animation: burst 1.5s ease-out forwards;
        }

        @keyframes burst {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(2.5); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
        }

        /* Reveal Screen Text */
        .message-container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 182, 193, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1.title {
            font-family: 'Dancing Script', cursive;
            color: var(--gold-main);
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1s ease, transform 1s ease;
        }
        
        h1.title.show {
            opacity: 1;
            transform: scale(1);
        }

        .typewriter-text {
            font-size: clamp(1rem, 4vw, 1.3rem);
            line-height: 1.6;
            color: var(--pink-light);
            min-height: 180px;
            text-align: left;
            width: 100%;
        }

        .typewriter-text p {
            margin-bottom: 12px;
            display: block;
        }

        /* Cursor effect */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: var(--gold-main);
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--pink-main);
            margin-top: 20px;
            align-self: flex-end;
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* Actions */
        .btn {
            background: linear-gradient(45deg, var(--pink-dark), var(--pink-main));
            border: none;
            border-radius: 30px;
            padding: 12px 30px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.4);
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .btn:active {
            transform: translateY(2px) scale(0.95);
        }

        .btn.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Audio Toggle */
        .audio-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 50;
            font-size: 1.2rem;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <!-- Canvas for particles -->
    <canvas id="particle-canvas"></canvas>
    
    <!-- Floating items like balloons and hearts -->
    <div id="floating-container"></div>

    <!-- Intro Screen (Gift Box) -->
    <div class="screen" id="intro-screen">
        <div class="gift-container" id="gift-container">
            <div class="light-burst" id="light-burst"></div>
            <div class="gift-box" id="gift-box">
                <div class="gift-lid" id="gift-lid">
                    <div class="bow"></div>
                </div>
            </div>
            <div class="hint-text" id="hint-text">Ketuk untuk membuka hadiahmu 🎁</div>
        </div>
    </div>

    <!-- Reveal Screen (Message) -->
    <div class="screen hidden" id="reveal-screen">
        <div class="message-container">
            <h1 class="title" id="birthday-title"></h1>
            <div class="typewriter-text" id="typewriter-container">
                <!-- Text gets injected here via JS -->
            </div>
            <div class="signature" id="signature-text"></div>
            <button class="btn" id="replay-btn" onclick="resetExperience()">Buka Lagi 🎁</button>
        </div>
    </div>

    <script>
        /* =======================================
           CONFIG: PENGATURAN NAMA, TEKS, DAN TANGGAL
           ======================================= */
        const CONFIG = {
            girlfriendName: "Sayang",
            boyfriendName: "Muhammad Adi Saputro",
            
            // Tanggal target: 3 Oktober 2026 jam 00:00 (Menggunakan timezone WIB / +07:00)
            targetDate: "2026-10-03T00:00:00+07:00", 
            
            wishes: [
                "Selamat ulang tahun, {name}! 🎉",
                "Terima kasih sudah hadir dan mewarnai hari-hariku.",
                "Semoga di usia barumu, kamu selalu sehat, bahagia, dan semua impianmu satu per satu terwujud.",
                "Aku bersyukur banget punya kamu. Kamu adalah hadiah terindah dalam hidupku.",
                "I love you, {name}! ❤️"
            ]
        };

        // DOM Elements
        const introScreen = document.getElementById('intro-screen');
        const revealScreen = document.getElementById('reveal-screen');
        const giftContainer = document.getElementById('gift-container');
        const giftBox = document.getElementById('gift-box');
        const giftLid = document.getElementById('gift-lid');
        const lightBurst = document.getElementById('light-burst');
        const hintText = document.getElementById('hint-text');
        
        const birthdayTitle = document.getElementById('birthday-title');
        const typewriterContainer = document.getElementById('typewriter-container');
        const signatureText = document.getElementById('signature-text');
        const replayBtn = document.getElementById('replay-btn');
        const floatingContainer = document.getElementById('floating-container');

        // State variables
        let isOpened = false;
        let particles = [];
        let fireworks = [];
        let particleTimer = 0;
        let isHighIntensity = false;
        let animationId;
        let typewriterTimeoutId;
        let floatingIntervalId;
        let timeSinceOpened = 0;
        let lastTime = 0;
        let isDeniedAnimRunning = false;

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const colors = ['#ffb6c1', '#ffd1dc', '#ff6b81', '#ffd700', '#ffea70', '#ffffff'];

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        class Confetti {
            constructor(x, y, isExplosion = false) {
                this.x = x;
                this.y = y;
                this.size = random(4, 10);
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = isExplosion ? random(0, Math.PI * 2) : random(Math.PI + Math.PI/4, Math.PI * 2 - Math.PI/4);
                const velocity = isExplosion ? random(2, 8) : random(8, 18);
                
                this.vx = Math.cos(angle) * velocity;
                this.vy = Math.sin(angle) * velocity;
                
                this.gravity = 0.15;
                this.friction = 0.98;
                this.opacity = 1;
                this.decay = random(0.005, 0.015);
                this.rotation = random(0, 360);
                this.rotSpeed = random(-10, 10);
                this.shape = Math.random() > 0.5 ? 'circle' : 'rect';
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.opacity -= this.decay;
                this.rotation += this.rotSpeed;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                
                if (this.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                }
                ctx.restore();
            }
        }

        class Firework {
            constructor() {
                this.x = random(canvas.width * 0.1, canvas.width * 0.9);
                this.y = canvas.height;
                this.targetY = random(canvas.height * 0.1, canvas.height * 0.4);
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speed = random(8, 14);
                this.angle = Math.PI / 2;
                this.vx = random(-2, 2);
                this.vy = -this.speed;
                this.trail = [];
                this.dead = false;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 5) this.trail.shift();

                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1; 

                if (this.vy >= 0 || this.y <= this.targetY) {
                    this.dead = true;
                    this.explode();
                }
            }

            explode() {
                const count = Math.floor(random(40, 80));
                for (let i = 0; i < count; i++) {
                    particles.push(new Confetti(this.x, this.y, true));
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                if (this.trail.length > 0) {
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                }
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.restore();
            }
        }

        function animateCanvas(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isOpened) {
                timeSinceOpened += dt;
                
                if (timeSinceOpened < 8000) {
                    if (Math.random() < 0.1) fireworks.push(new Firework());
                } else {
                    if (Math.random() < 0.02) fireworks.push(new Firework());
                }
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw(ctx);
                if (fireworks[i].dead) fireworks.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].opacity <= 0) particles.splice(i, 1);
            }

            animationId = requestAnimationFrame(animateCanvas);
        }

        animationId = requestAnimationFrame(animateCanvas);

        function createFloatingElement() {
            if (!isOpened) return;
            
            const el = document.createElement('div');
            el.classList.add('floating-item');
            
            const emojis = ['❤️', '💖', '🎈', '✨'];
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            el.style.left = random(5, 95) + 'vw';
            const duration = random(8, 15);
            el.style.animationDuration = duration + 's';
            el.style.fontSize = random(1.5, 3) + 'rem';
            
            floatingContainer.appendChild(el);
            
            setTimeout(() => {
                if(el.parentNode) el.parentNode.removeChild(el);
            }, duration * 1000);
        }

        function typeWriter(lines, container, onComplete) {
            container.innerHTML = '';
            let lineIndex = 0;
            let charIndex = 0;
            let currentParagraph = null;

            const cursor = document.createElement('span');
            cursor.className = 'cursor';

            function typeNextChar() {
                if (lineIndex < lines.length) {
                    let text = lines[lineIndex].replace(/{name}/g, CONFIG.girlfriendName);
                    
                    if (charIndex === 0) {
                        currentParagraph = document.createElement('p');
                        container.appendChild(currentParagraph);
                        container.appendChild(cursor);
                    }

                    if (charIndex < text.length) {
                        currentParagraph.textContent += text.charAt(charIndex);
                        charIndex++;
                        typewriterTimeoutId = setTimeout(typeNextChar, random(30, 70));
                    } else {
                        lineIndex++;
                        charIndex = 0;
                        typewriterTimeoutId = setTimeout(typeNextChar, 500);
                    }
                } else {
                    if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
                    if (onComplete) onComplete();
                }
            }

            typeNextChar();
        }

        giftContainer.addEventListener('click', openGift);

        function openGift() {
            if (isOpened || isDeniedAnimRunning) return;

            // ==========================================
            // VALIDASI TANGGAL
            // ==========================================
            const now = new Date();
            const targetDate = new Date(CONFIG.targetDate);

            if (now < targetDate) {
                isDeniedAnimRunning = true;
                const originalText = hintText.innerText;
                
                // Ubah teks sementara
                hintText.innerText = "Sabar ya, tunggu tanggal 3 Oktober! 😜";
                hintText.style.color = "var(--pink-dark)";
                
                // Beri animasi penolakan
                giftBox.classList.add('denied-shake');
                
                setTimeout(() => {
                    giftBox.classList.remove('denied-shake');
                    isDeniedAnimRunning = false;
                }, 400);

                // Kembalikan teks ke semula setelah 3 detik
                setTimeout(() => {
                    if (!isOpened) {
                        hintText.innerText = originalText;
                        hintText.style.color = "var(--pink-light)";
                    }
                }, 3000);
                
                return; // Batalkan proses pembukaan kado
            }
            // ==========================================

            isOpened = true;

            giftBox.style.animation = 'none';
            hintText.style.opacity = '0';
            
            giftBox.classList.add('shake');

            setTimeout(() => {
                giftBox.classList.remove('shake');
                
                giftLid.classList.add('pop-lid');
                lightBurst.classList.add('burst-anim');

                const boxRect = giftBox.getBoundingClientRect();
                const startX = boxRect.left + boxRect.width / 2;
                const startY = boxRect.top + boxRect.height / 2;

                for (let i = 0; i < 150; i++) {
                    particles.push(new Confetti(startX, startY, false));
                }

                floatingIntervalId = setInterval(createFloatingElement, 800);
                timeSinceOpened = 0;

                setTimeout(showRevealScreen, 1500);

            }, 1000); 
        }

        function showRevealScreen() {
            introScreen.classList.add('hidden');
            revealScreen.classList.remove('hidden');

            birthdayTitle.innerText = `Selamat Ulang Tahun, ${CONFIG.girlfriendName}! 🎂`;
            
            setTimeout(() => {
                birthdayTitle.classList.add('show');
                
                setTimeout(() => {
                    typeWriter(CONFIG.wishes, typewriterContainer, showEndElements);
                }, 1000);

            }, 500);
        }

        function showEndElements() {
            signatureText.innerText = `Dari: ${CONFIG.boyfriendName} ❤️`;
            signatureText.style.opacity = '1';
            
            setTimeout(() => {
                replayBtn.classList.add('show');
            }, 500);
        }

        function resetExperience() {
            isOpened = false;
            timeSinceOpened = 0;
            particles = [];
            fireworks = [];
            clearInterval(floatingIntervalId);
            clearTimeout(typewriterTimeoutId);
            floatingContainer.innerHTML = '';
            
            introScreen.classList.remove('hidden');
            revealScreen.classList.add('hidden');
            
            giftBox.style.animation = 'bounce 2s infinite ease-in-out';
            giftBox.classList.remove('shake');
            giftBox.classList.remove('denied-shake');
            giftLid.classList.remove('pop-lid');
            lightBurst.classList.remove('burst-anim');
            
            hintText.innerText = "Ketuk untuk membuka hadiahmu 🎁";
            hintText.style.color = "var(--pink-light)";
            hintText.style.opacity = '1';

            birthdayTitle.classList.remove('show');
            typewriterContainer.innerHTML = '';
            signatureText.style.opacity = '0';
            replayBtn.classList.remove('show');
        }

    </script>
</body>
</html>
